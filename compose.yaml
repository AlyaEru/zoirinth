services:
  # Frontend service
  zoirinth-frontend:
    image: node:18-alpine
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    command: |
      sh -c "
        cd /app &&
        npm install &&
        npm run build &&
        npx http-server -p 3000 -a 0.0.0.0 public
      "
    ports:
      - "3000:3000"
    depends_on:
      - zoirinth-api

  # API service for highscores
  zoirinth-api:
    image: node:18-alpine
    volumes:
      - ./backend:/app
    working_dir: /app
    command: |
      sh -c "
        cd /app &&
        npm install express fs &&
        node server.js
      "
    ports:
      - "3001:3001"
    expose:
      - "3001"
